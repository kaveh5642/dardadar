name: Direct SSH VPN (Fixed Port Edition)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh curl

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Create SSH User (Masoud)
        run: |
          USER_PASS="13691369"
          ENCRYPTED_PASS=$(perl -e 'print crypt($ARGV[0], "password")' $USER_PASS)
          sudo useradd -m -p "$ENCRYPTED_PASS" -s /bin/bash masoud
          echo "User 'masoud' created."

      - name: Configure SSH Server
        run: |
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          echo "AllowTcpForwarding yes" | sudo tee -a /etc/ssh/sshd_config
          echo "TCPKeepAlive yes" | sudo tee -a /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Establish Fixed TCP Tunnel
        run: |
          echo "--------------------------------------------------------"
          # تولید یک پورت تصادفی بین 10000 تا 50000 برای اطمینان از آزاد بودن
          RANDOM_PORT=$(( ( RANDOM % 40000 )  + 10000 ))
          echo "TARGET_PORT=$RANDOM_PORT" >> $GITHUB_ENV
          
          echo "Connecting to Serveo on Port: $RANDOM_PORT"
          echo "--------------------------------------------------------"
          
          # فوروارد کردن پورت SSH به پورت تصادفی انتخاب شده
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_PORT:localhost:22 serveo.net 2>&1 &
          
          sleep 15

      - name: Final Connection Details
        run: |
          echo "===================================================="
          echo "🚀 SSH VPN IS READY!"
          echo "===================================================="
          echo "SERVER (Host): serveo.net"
          echo "PORT: ${{ env.TARGET_PORT }}"
          echo "USERNAME: masoud"
          echo "PASSWORD: 13691369"
          echo "===================================================="
          echo "Configure Netmod with these details."
          echo "If handshake fails, please run the workflow again to get a new port."

      - name: Keep Server Alive
        run: |
          for i in {1..72}; do
            echo "Heartbeat $i: VPN Server is Active on Port ${{ env.TARGET_PORT }}..."
            sleep 300
          done
