name: Shahan SSH Management (Root Fixed)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh curl

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Install Shahan SSH Panel (Root & TERM Fixed)
        run: |
          # رفع مشکل دسترسی به resolv.conf
          sudo chattr -i /etc/resolv.conf || true
          sudo chmod 644 /etc/resolv.conf
          
          # تنظیم متغیرهای محیطی برای شبیه‌سازی ترمینال واقعی
          export TERM=xterm
          export DEBIAN_FRONTEND=noninteractive
          
          # اجرای اسکریپت با دسترسی کامل روت و شبیه‌سازی اینتر زدن‌های متوالی
          # استفاده از sudo -E برای انتقال متغیر TERM به داخل اسکریپت
          printf '\n1\n1\n1\ny\n' | sudo -E bash <(curl -Ls https://raw.githubusercontent.com/HamedAp/Ssh-User-management/master/install.sh --ipv4)

      - name: Post-Installation Fixes
        run: |
          # اطمینان از اینکه پورت 2222 باز است تا با SSH گیت‌هاب تداخل نکند
          sudo sed -i 's/#Port 22/Port 22\nPort 2222/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart

      - name: Establish SSH Public Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo for SSH Management..."
          echo "--------------------------------------------------------"
          
          RANDOM_ALIAS="sshshahan$(date +%s%N | cut -c13-20)"
          echo "Your Public Domain: $RANDOM_ALIAS.serveo.net"
          
          # فوروارد کردن پورت SSH کاربران (2222) به پورت 443 عمومی
          # فوروارد کردن پورت احتمالی پنل (8080) به پورت 80 عمومی
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_ALIAS:443:localhost:2222 \
            -R $RANDOM_ALIAS:80:localhost:8080 \
            serveo.net 2>&1 &
          
          sleep 20

      - name: Server Status and Keep Alive
        run: |
          echo "===================================================="
          echo "SSH Management is Active!"
          echo "Domain: $RANDOM_ALIAS.serveo.net"
          echo "Connect Users via Port 443"
          echo "===================================================="
          
          for i in {1..72}; do
            echo "Heartbeat $i: System is up."
            sudo ss -tulpn | grep -E '2222|8080' || echo "Services checking..."
            sleep 300
          done
