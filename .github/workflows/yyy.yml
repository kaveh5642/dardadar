name: SSH User Management (HamedAp + Serveo)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh curl

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Install HamedAp SSH Management
        run: |
          # اجرای اسکریپت نصب با استفاده از آرگومان‌های احتمالی برای عبور از مراحل تعاملی
          # توجه: اگر اسکریپت در حین نصب سوالی بپرسد، ما با 'yes' پاسخ می‌دهیم
          yes | bash <(curl -Ls https://raw.githubusercontent.com/HamedAp/Ssh-User-management/master/install.sh --ipv4)
          
          # اطمینان از اینکه سرویس SSH روی پورت 2222 هم گوش می‌دهد
          # این کار برای جلوگیری از تداخل با SSH اصلی گیت‌هاب است
          sudo sed -i 's/#Port 22/Port 22\nPort 2222/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Establish SSH Public Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo for SSH Tunneling..."
          echo "--------------------------------------------------------"
          
          RANDOM_ALIAS="ssh-mgr$(date +%s%N | cut -c13-20)"
          echo "Your Public Domain: $RANDOM_ALIAS.serveo.net"
          
          # فوروارد کردن:
          # پورت 443 عمومی Serveo -> به پورت 2222 رانر (SSH Users)
          # پورت 80 عمومی Serveo -> به پورت 8080 رانر (اگر پنل وب داشته باشد)
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_ALIAS:443:localhost:2222 \
            -R $RANDOM_ALIAS:80:localhost:8080 \
            serveo.net 2>&1 &
          
          sleep 20

      - name: Server Status and Keep Alive
        run: |
          echo "===================================================="
          echo "SSH Management is Active!"
          echo "Connect via: ssh user@$RANDOM_ALIAS.serveo.net -p 443"
          echo "===================================================="
          
          for i in {1..72}; do
            echo "Still Alive - Heartbeat $i"
            # مانیتورینگ وضعیت پورت 2222
            sudo ss -tulpn | grep 2222 || echo "SSH Service is active"
            sleep 300
          done
