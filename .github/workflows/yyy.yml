name: X-UI with Serveo WireGuard Tunnel

on:
  workflow_dispatch: 

jobs:
  deploy-and-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install WireGuard and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf curl ssh

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard Tunnel
        run: |
          sudo wg-quick up wg0 || true
          sudo wg show

      - name: Install 3x-ui Panel
        run: |
          # اجرای اسکریپت با دسترسی کامل روت و تزریق ورودی‌ها
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo bash <<EOF
          y
          admin
          admin_password
          2053
          EOF
          
          # اطمینان از اجرا شدن سرویس
          sudo x-ui restart

      - name: Establish SSH Reverse Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo..."
          echo "--------------------------------------------------------"
          
          # فوروارد کردن پورت پنل و پورت ریلیتی
          # پورت 80 سرور Serveo به 2053 رانر (پنل) وصل می‌شود
          # پورت 443 سرور Serveo به 443 رانر (Reality) وصل می‌شود
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ExitOnForwardFailure=yes -R 80:localhost:2053 -R 443:localhost:443 serveo.net &
          
          sleep 15
          echo "Check the output above for your assigned URL."

      - name: Runner Keep Alive
        run: |
          echo "Runner is active. Status of ports:"
          sudo ss -tulpn | grep -E '2053|443'
          
          echo "Keep-alive started. This job will run for 6 hours unless stopped."
          # یک حلقه برای چاپ وضعیت در هر 5 دقیقه تا رانر غیرفعال نشود
          for i in {1..72}; do
            echo "Still running... (Step $i/72)"
            sleep 300
          done
