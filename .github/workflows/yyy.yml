name: Ultimate X-UI 2026 (Docker + Serveo)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Enable BBR Speed Booster
        run: |
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Install 3x-ui Panel via Docker
        run: |
          # اجرای پنل در داکر - یوزر و پسورد طبق الگوی شما تنظیم شد
          sudo docker run -d --name 3x-ui --network=host \
            -e XRAY_VMESS_AEAD_FORCED=false \
            -e XUI_USERNAME=admin \
            -e XUI_PASSWORD=13691369 \
            -e XUI_PORT=2053 \
            ghcr.io/mhsanaei/3x-ui:latest

      - name: Establish SSH Public Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo for Public Access..."
          echo "--------------------------------------------------------"
          # فوروارد کردن پورت پنل به پورت 80 و پورت Reality به 443
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:2053 -R 443:localhost:443 serveo.net &
          
          sleep 15
          echo "Check the logs of this step to find your assigned .serveo.net URL"

      - name: Keep Server Alive
        run: |
          echo "===================================================="
          echo "Server Started Successfully!"
          echo "Username: admin"
          echo "Password: 13691369"
          echo "Panel Port: 80 (via Serveo URL)"
          echo "Reality Port: 443 (via Serveo URL)"
          echo "===================================================="
          # حلقه برای باز نگه داشتن رانر به مدت 6 ساعت
          for i in {1..72}; do
            echo "Heartbeat $i: VPN is Active..."
            sudo docker ps | grep 3x-ui
            sleep 300
          done
