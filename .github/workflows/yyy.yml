name: Ultimate X-UI 2026 (Docker + Serveo Fixed)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Enable BBR Speed Booster
        run: |
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Install 3x-ui Panel via Docker
        run: |
          sudo docker run -d --name 3x-ui --network=host \
            -e XRAY_VMESS_AEAD_FORCED=false \
            -e XUI_USERNAME=admin \
            -e XUI_PASSWORD=13691369 \
            -e XUI_PORT=2053 \
            ghcr.io/mhsanaei/3x-ui:latest

      - name: Establish SSH Public Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo with Alias..."
          echo "--------------------------------------------------------"
          
          # به جای 'myuniquevpn' یک اسم کاملاً تصادفی و خاص بگذارید (فقط حروف و عدد)
          # این کار محدودیت پورت 443 و 80 را برطرف می‌کند
          # فرمت: alias:remote_port:local_host:local_port
          
          RANDOM_ALIAS="vpn$(date +%s%N | cut -c13-20)"
          echo "Your Alias is: $RANDOM_ALIAS"
          
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_ALIAS:80:localhost:2053 \
            -R $RANDOM_ALIAS:443:localhost:443 \
            serveo.net &
          
          sleep 15

      - name: Keep Server Alive
        run: |
          echo "===================================================="
          echo "Server is running!"
          echo "1. Open the URL shown in 'Establish SSH' step"
          echo "2. Click 'Continue to Site' on the Serveo warning"
          echo "3. Login with admin / 13691369"
          echo "===================================================="
          for i in {1..72}; do
            echo "Heartbeat $i: VPN is Active..."
            sudo docker ps | grep 3x-ui
            sleep 300
          done
