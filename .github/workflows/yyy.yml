name: Shahan Panel 2026 (Docker + Serveo)

on:
  workflow_dispatch: # اجرای دستی از بخش Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install WireGuard and Connectivity Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh curl docker.io

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Enable BBR Speed Booster
        run: |
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Install Shahan Panel via Docker
        run: |
          # اجرای پنل شاهان در حالت شبکه Host برای دسترسی مستقیم به پورت‌ها
          sudo docker run -d --name shahan --network=host \
            -e ADMIN_USER=admin \
            -e ADMIN_PASS=13691369 \
            -e PANEL_PORT=8080 \
            hamedap/shahan:latest

      - name: Establish SSH Public Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo for Shahan Panel..."
          echo "--------------------------------------------------------"
          
          # تولید یک نام مستعار (Alias) تصادفی برای آدرس اینترنتی
          RANDOM_ALIAS="shahan$(date +%s%N | cut -c13-20)"
          echo "Your Public Domain will be: $RANDOM_ALIAS.serveo.net"
          
          # فوروارد کردن پورت‌ها:
          # پورت 80 عمومی Serveo -> پورت 8080 رانر (پنل شاهان)
          # پورت 443 عمومی Serveo -> پورت 443 رانر (مورد نیاز Reality)
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_ALIAS:80:localhost:8080 \
            -R $RANDOM_ALIAS:443:localhost:443 \
            serveo.net 2>&1 &
          
          sleep 20
          echo "Check the logs above to find the exact forwarding URL."

      - name: Server Status and Keep Alive
        run: |
          echo "===================================================="
          echo "Shahan Panel is now LIVE!"
          echo "Panel URL: Look for 'Forwarding HTTP traffic' in the step above"
          echo "Default Username: admin"
          echo "Default Password: 13691369"
          echo "Reality Port to use: 443"
          echo "===================================================="
          
          # مانیتورینگ سیستم برای جلوگیری از بسته شدن جاب (حداکثر 6 ساعت)
          for i in {1..72}; do
            echo "Heartbeat $i: Shahan Panel & Tunnel are active..."
            sudo docker ps | grep shahan
            sleep 300
          done
