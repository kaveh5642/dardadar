name: Shahan SSH Management (Disk Execution Fix)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh curl

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Download and Install SSH Panel
        run: |
          # تنظیم متغیرهای محیطی
          export TERM=xterm
          export DEBIAN_FRONTEND=noninteractive
          
          # مرحله 1: دانلود اسکریپت روی دیسک
          echo "Downloading script..."
          curl -Ls https://raw.githubusercontent.com/HamedAp/Ssh-User-management/master/install.sh -o hamed-install.sh
          
          # مرحله 2: اصلاح مجوزها
          chmod +x hamed-install.sh
          
          # مرحله 3: اجرای فایل از روی دیسک با شبیه‌سازی اینتر (Enter)
          # استفاده از sudo -E برای حفظ متغیر TERM
          echo "Starting installation from disk..."
          printf '\n1\n1\n1\ny\n' | sudo -E ./hamed-install.sh

      - name: Post-Installation Fixes
        run: |
          # باز کردن پورت 2222 برای کاربران SSH
          sudo sed -i 's/#Port 22/Port 22\nPort 2222/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart

      - name: Establish SSH Public Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo..."
          echo "--------------------------------------------------------"
          
          RANDOM_ALIAS="ssh-shahan-$(date +%s | cut -c5-10)"
          echo "Your Public Domain: $RANDOM_ALIAS.serveo.net"
          
          # فوروارد کردن پورت SSH (2222) به 443 عمومی
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_ALIAS:443:localhost:2222 \
            serveo.net 2>&1 &
          
          sleep 20

      - name: Keep Server Alive
        run: |
          echo "===================================================="
          echo "SSH Management is running!"
          echo "Domain: $RANDOM_ALIAS.serveo.net"
          echo "Port: 443"
          echo "===================================================="
          
          for i in {1..72}; do
            echo "Heartbeat $i: Still running..."
            sleep 300
          done
