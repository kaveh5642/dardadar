name: X-UI with Serveo WireGuard Tunnel

on:
  workflow_dispatch: 

jobs:
  deploy-and-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install WireGuard and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf curl ssh

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard Tunnel
        run: |
          sudo wg-quick up wg0 || true
          sudo wg show

      - name: Install 3x-ui Panel (Force Method)
        run: |
          # نصب با تایید اجباری y برای تمام سوالات
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo DEV_INSTALL=true bash
          
          # تنظیمات دستی یوزر و پسورد و پورت بدون سوال و جواب
          sudo /usr/local/x-ui/x-ui setting -username admin -password admin_password
          sudo /usr/local/x-ui/x-ui setting -port 2053
          
          # ریستارت برای اعمال تغییرات
          sudo x-ui restart

      - name: Establish SSH Reverse Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo..."
          echo "--------------------------------------------------------"
          
          # اجرای تونل
          # ما از -tt برای شبیه‌سازی ترمینال استفاده می‌کنیم تا لاگ‌ها را بهتر ببینیم
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:2053 -R 443:localhost:443 serveo.net &
          
          sleep 20

      - name: Runner Keep Alive & Status
        run: |
          echo "--- Local Ports Status ---"
          sudo ss -tulpn | grep -E '2053|443'
          
          echo "--------------------------------------------------------"
          echo "Keep-alive is active. Check the 'Establish SSH' logs."
          echo "--------------------------------------------------------"
          
          # جلوگیری از بسته شدن رانر با چاپ مداوم لاگ
          for i in {1..72}; do
            echo "Heartbeat $i: System is up."
            # بررسی اینکه آیا x-ui هنوز در حال اجراست
            sudo x-ui status | grep "running" || echo "Checking..."
            sleep 300
          done
