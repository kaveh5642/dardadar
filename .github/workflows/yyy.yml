name: X-UI with Serveo WireGuard Tunnel

on:
  workflow_dispatch: 

jobs:
  deploy-and-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install WireGuard and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf curl ssh

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard Tunnel
        run: |
          sudo wg-quick up wg0 || true
          sudo wg show

      - name: Install 3x-ui Panel
        run: |
          # دانلود اسکریپت
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o install.sh
          chmod +x install.sh
          
          # اجرای اسکریپت با ارسال ورودی‌ها به ترتیب:
          # y (تایید نصب)
          # admin (یوزرنیم)
          # admin_password (پسورد)
          # 2053 (پورت)
          echo -e "y\nadmin\nadmin_password\n2053\n" | sudo ./install.sh
          
          # اطمینان از اجرا
          sudo x-ui restart

      - name: Establish SSH Reverse Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo..."
          echo "--------------------------------------------------------"
          
          # اجرای تونل در پس‌زمینه
          # پورت 80 سرور Serveo -> پورت 2053 رانر
          # پورت 443 سرور Serveo -> پورت 443 رانر
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:2053 -R 443:localhost:443 serveo.net &
          
          # زمان دادن برای برقراری تونل و چاپ لاگ‌ها
          sleep 20

      - name: Runner Keep Alive
        run: |
          echo "Runner is active. Status of ports:"
          sudo ss -tulpn | grep -E '2053|443'
          
          echo "--------------------------------------------------------"
          echo "Look at the 'Establish SSH Reverse Tunnel' step logs"
          echo "to find your public URL (e.g., https://something.serveo.net)"
          echo "--------------------------------------------------------"
          
          # حلقه برای زنده نگه داشتن رانر و چاپ لاگ
          for i in {1..72}; do
            echo "Heartbeat: Still running... (Step $i/72)"
            sleep 300
          done
