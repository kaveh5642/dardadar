name: Direct SSH VPN (User Masoud)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf ssh curl

      - name: Setup WireGuard Config
        run: |
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${{ secrets.SERVEO_WG_PRIVATE_KEY }}
          Address = ${{ secrets.SERVEO_WG_ADDRESS || '10.1.1.2/32' }}

          [Peer]
          PublicKey = 7vL9mU/n5W/2X5l5p6yF9f+9L6w4J4f5Z6u7i8o9p0A=
          Endpoint = wireguard.serveo.net:51820
          AllowedIPs = 10.0.0.0/8
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard
        run: sudo wg-quick up wg0 || true

      - name: Create SSH User (Masoud)
        run: |
          # ساخت یوزر مسعود با پسورد مشخص
          # استفاده از openssl برای رمزنگاری پسورد در دستور useradd
          USER_PASS="13691369"
          ENCRYPTED_PASS=$(perl -e 'print crypt($ARGV[0], "password")' $USER_PASS)
          sudo useradd -m -p "$ENCRYPTED_PASS" -s /bin/bash masoud
          
          # اضافه کردن به گروه sudo (اختیاری برای مدیریت، اما برای تونل لازم نیست)
          # sudo usermod -aG sudo masoud
          
          echo "User 'masoud' created successfully."

      - name: Configure SSH Server
        run: |
          # تنظیمات لازم برای اجازه ورود با پسورد و تونلینگ
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/g' /etc/ssh/sshd_config
          
          # اطمینان از فعال بودن TCP Forwarding برای Netmod
          echo "AllowTcpForwarding yes" | sudo tee -a /etc/ssh/sshd_config
          echo "GatewayPorts yes" | sudo tee -a /etc/ssh/sshd_config
          
          sudo systemctl restart ssh

      - name: Establish Serveo Tunnel
        run: |
          echo "--------------------------------------------------------"
          echo "Connecting to Serveo..."
          echo "--------------------------------------------------------"
          
          # ایجاد یک نام ثابت یا تصادفی برای دامنه
          # ما پورت 22 (SSH) را به پورت 443 عمومی Serveo وصل می‌کنیم
          RANDOM_ALIAS="vpn-masoud-$(date +%s | cut -c6-10)"
          echo "Your Public Domain: $RANDOM_ALIAS.serveo.net"
          
          sudo ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R $RANDOM_ALIAS:443:localhost:22 \
            serveo.net 2>&1 &
          
          sleep 20

      - name: Display Connection Info
        run: |
          echo "===================================================="
          echo "SSH VPN IS READY!"
          echo "Host: (Check the 'Establish Serveo Tunnel' step for the URL)"
          echo "Port: 443"
          echo "Username: masoud"
          echo "Password: 13691369"
          echo "===================================================="

      - name: Keep Server Alive
        run: |
          for i in {1..72}; do
            echo "Heartbeat $i: VPN Server for Masoud is Active..."
            sleep 300
          done
