name: Netbird Exit Node VPN (5h)
on:
  workflow_dispatch:

jobs:
  netbird-exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 298
    
    steps:
      - name: Update system
        run: sudo apt update -y
        
      - name: Enable IP forwarding
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-netbird.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-netbird.conf
          sudo sysctl -p /etc/sysctl.d/99-netbird.conf
          
      - name: Install Netbird
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          
      - name: Connect to Netbird as Exit Node
        run: |
          sudo netbird up \
            --setup-key ${{ secrets.NETBIRD_SETUP_KEY }} \
            --allow-server-ssh \
            --enable-rosenpass
          
      - name: Configure iptables for Exit Node (NAT)
        run: |
          # دریافت اینترفیس Netbird
          NB_INTERFACE=$(ip -o link show | grep -o 'wt[0-9]*' | head -1)
          
          # NAT برای ترافیک خروجی
          sudo iptables -A FORWARD -i $NB_INTERFACE -o eth0 -j ACCEPT
          sudo iptables -A FORWARD -i eth0 -o $NB_INTERFACE -m state --state RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          
          # اجازه ترافیک بین کاربران Netbird
          sudo iptables -A FORWARD -i $NB_INTERFACE -o $NB_INTERFACE -j ACCEPT
          
          echo "NAT configured for interface: $NB_INTERFACE"
          
      - name: Display Exit Node Info
        run: |
          echo "================================"
          echo "🚀 Netbird Exit Node is ACTIVE"
          echo "================================"
          sudo netbird status
          echo ""
          echo "📊 Network Info:"
          echo "Netbird IP: $(ip addr show | grep -oP '100\.64\.\d+\.\d+' | head -1)"
          echo "Public IP: $(curl -s ifconfig.me)"
          echo ""
          echo "✅ Users can now route through this node!"
          echo ""
          echo "📋 Connection Instructions:"
          echo "1. Install Netbird on your device"
          echo "2. Run: netbird up --setup-key YOUR_SETUP_KEY"
          echo "3. Set this node as exit route"
          
      - name: Monitor traffic
        run: |
          echo "🔄 Monitoring network traffic..."
          while true; do
            echo "--- $(date) ---"
            sudo netbird status
            echo "Active connections:"
            sudo iptables -t nat -L POSTROUTING -n -v | grep -v "^Chain"
            sleep 300  # هر 5 دقیقه
          done &
          
      - name: Keep Exit Node alive (5 hours)
        run: |
          echo "Exit Node is running for 5 hours..."
          sleep 18000
