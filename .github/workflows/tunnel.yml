name: SSH VPN - LocalTunnel (Simple & Fast)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Server
        run: |
          # فعال‌سازی SSH با تنظیمات امن
          sudo systemctl start ssh
          sudo systemctl enable ssh
          
          # ساخت یوزر vpn با پسورد قوی
          VPN_PASS=$(openssl rand -base64 16)
          echo "vpnuser:$VPN_PASS" | sudo chpasswd
          sudo useradd -m -s /bin/bash vpnuser 2>/dev/null || true
          echo "vpnuser:$VPN_PASS" | sudo chpasswd
          
          # تنظیمات SSH برای تونل
          sudo tee -a /etc/ssh/sshd_config > /dev/null <<EOF
          
          # VPN Tunnel Settings
          PermitTunnel yes
          GatewayPorts yes
          AllowTcpForwarding yes
          PasswordAuthentication yes
          EOF
          
          sudo systemctl restart ssh
          
          # ذخیره پسورد برای step بعدی
          echo "PASS=$VPN_PASS" >> $GITHUB_ENV

      - name: Install LocalTunnel
        run: |
          sudo npm install -g localtunnel

      - name: Start SSH Tunnel via LocalTunnel
        id: tunnel
        run: |
          # تونل SSH روی پورت 22
          lt --port 22 --subdomain iran-ssh-vpn-$RANDOM > lt.log 2>&1 &
          
          echo "⏳ Waiting for tunnel..."
          for i in {1..40}; do
            TUNNEL=$(grep -o 'https://[^[:space:]]*\.loca\.lt' lt.log | head -1)
            if [ -n "$TUNNEL" ]; then
              # استخراج دامنه و پورت
              DOMAIN=$(echo $TUNNEL | sed 's|https://||')
              
              echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
              echo "✅ SSH Tunnel Ready: $TUNNEL"
              break
            fi
            sleep 2
          done
          
          if [ -z "$TUNNEL" ]; then
            echo "❌ Failed! Log:"
            cat lt.log
            exit 1
          fi

      - name: Display Connection Info
        run: |
          DOMAIN="${{ steps.tunnel.outputs.domain }}"
          PASS="${{ env.PASS }}"
          
          echo "========================================================="
          echo "🇮🇷 SSH VPN آماده است!"
          echo ""
          echo "📋 مشخصات اتصال:"
          echo "Host: $DOMAIN"
          echo "Port: 443"
          echo "Username: vpnuser"
          echo "Password: $PASS"
          echo ""
          echo "========================================================="
          echo "📱 نحوه استفاده در اندروید:"
          echo ""
          echo "1️⃣ نصب HTTP Injector یا v2rayNG"
          echo ""
          echo "2️⃣ HTTP Injector:"
          echo "   - SSH Settings:"
          echo "     Host: $DOMAIN"
          echo "     Port: 443"
          echo "     Username: vpnuser"
          echo "     Password: $PASS"
          echo "   - Payload: زیر را کپی کن ↓"
          echo ""
          echo "GET / HTTP/1.1[crlf]Host: $DOMAIN[crlf]Upgrade: websocket[crlf][crlf]"
          echo ""
          echo "3️⃣ یا استفاده مستقیم SSH Tunnel:"
          echo "   نصب اپلیکیشن 'SSH Tunnel' از پلی استور"
          echo "   تنظیمات:"
          echo "   - Remote: $DOMAIN:443"
          echo "   - Username: vpnuser"  
          echo "   - Password: $PASS"
          echo "   - Local Port: 1080 (SOCKS5)"
          echo ""
          echo "========================================================="
          echo "💻 استفاده در ویندوز/لینوکس/مک:"
          echo ""
          echo "دستور SSH Tunnel:"
          echo "ssh -D 1080 -N vpnuser@$DOMAIN -p 443"
          echo ""
          echo "بعد SOCKS5 proxy رو تنظیم کن:"
          echo "127.0.0.1:1080"
          echo ""
          echo "========================================================="
          echo "🌐 استفاده در تلگرام:"
          echo ""
          echo "Settings > Data and Storage > Proxy Settings"
          echo "Type: SOCKS5"
          echo "Server: 127.0.0.1"
          echo "Port: 1080"
          echo "========================================================="

      - name: Keep Alive (6 hours)
        run: |
          echo "🟢 SSH VPN is Running..."
          echo "⏱️ Runtime: 6 hours"
          
          for i in {1..360}; do
            sleep 60
            
            # نمایش وضعیت هر 10 دقیقه
            if [ $((i % 10)) -eq 0 ]; then
              ACTIVE=$(who | wc -l)
              echo "⏱️ Uptime: $i min | Active connections: $ACTIVE"
            fi
          done
          
          echo "⏹️ Session Expired - Run workflow again for new connection"
