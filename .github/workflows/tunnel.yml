name: Ultimate Ephemeral VPN 2026 (Fixed & Sudo)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget openssl

      - name: Install Xray-core
        run: |
          # نصب هسته اصلی با دسترسی روت
          curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh | sudo bash -s -- install -u root

      - name: Install Cloudflared (Fixed Filename)
        run: |
          # دانلود با نام مشخص برای جلوگیری از خطای پیدا نشدن فایل
          wget -O cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Generate Reality Keys & Config
        id: vars
        run: |
          # تولید کلیدها و شناسه با sudo
          UUID=$(sudo /usr/local/bin/xray uuid)
          KEYS=$(sudo /usr/local/bin/xray x25519)
          PRIVATE_KEY=$(echo $KEYS | awk '{print $3}')
          PUBLIC_KEY=$(echo $KEYS | awk '{print $6}')
          SHORT_ID=$(openssl rand -hex 8)
          
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          echo "pub=$PUBLIC_KEY" >> $GITHUB_OUTPUT
          echo "sid=$SHORT_ID" >> $GITHUB_OUTPUT
          
          # ایجاد فایل کانفیگ سرور
          sudo cat <<EOF > config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds":,
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "show": false,
                  "dest": "www.google.com:443",
                  "xver": 0,
                  "serverNames": ["www.google.com", "dl.google.com"],
                  "privateKey": "$PRIVATE_KEY",
                  "shortIds":
                }
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF

      - name: Start Xray Server
        run: |
          sudo /usr/local/bin/xray run -c config.json &

      - name: Establish Argo Tunnel
        id: tunnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # اجرای تانل با sudo و هدایت به پورت xray
          sudo cloudflared tunnel --url http://localhost:8080 > cf.log 2>&1 &
          
          echo "در حال دریافت آدرس از کلودفلر..."
          sleep 25
          
          # استخراج آدرس موقت از فایل لاگ
          TUNNEL_URL=$(grep -o 'https://.*\.trycloudflare.com' cf.log | head -n 1 | sed 's/https:\/\///')
          
          if; then
            echo "خطا در برقراری تانل! لاگ نهایی:"
            cat cf.log
            exit 1
          fi
          
          echo "url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      - name: Final Configuration Output
        run: |
          UUID="${{ steps.vars.outputs.uuid }}"
          DOMAIN="${{ steps.tunnel.outputs.url }}"
          PUB_KEY="${{ steps.vars.outputs.pub }}"
          SHORT_ID="${{ steps.vars.outputs.sid }}"
          
          # لینک VLESS نهایی با پارامترهای ضد فیلترینگ
          VLESS_LINK="vless://$UUID@$DOMAIN:443?encryption=none&security=reality&sni=www.google.com&fp=chrome&pbk=$PUB_KEY&sid=$SHORT_ID&type=tcp&headerType=none&flow=xtls-rprx-vision#Runner-VPN-$(date +%H%M)"
          
          echo "========================================================="
          echo "لینک اتصال شما (در v2rayNG یا Nekobox کپی کنید):"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "نکته مهم: در تنظیمات کلاینت، قابلیت Fragmentation را فعال کنید."
          echo "========================================================="

      - name: Keep Runner Alive
        run: |
          echo "سرور به مدت ۶ ساعت فعال است."
          for i in {1..72}; do
            echo "Heartbeat $i: Connection Active..."
            sleep 300
          done
