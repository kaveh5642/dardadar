name: Ultimate Ephemeral VPN 2026 (Working Version)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget openssl

      - name: Install Xray-core
        run: |
          curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh | sudo bash -s -- install -u root

      - name: Install Cloudflared
        run: |
          sudo wget -q -O /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Generate Config & Keys
        id: vars
        run: |
          UUID=$(/usr/local/bin/xray uuid)
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          
          # کانفیگ VLESS-WebSocket (سازگار با Cloudflare Tunnel)
          cat <<EOF > config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 8080,
              "protocol": "vless",
              "settings": {
                "clients": [{
                  "id": "$UUID",
                  "level": 0
                }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "/vless"
                }
              }
            }],
            "outbounds": [{ 
              "protocol": "freedom",
              "settings": {}
            }]
          }
          EOF
          
          cat config.json

      - name: Start Xray Server
        run: |
          sudo /usr/local/bin/xray run -c config.json &
          sleep 5
          echo "Xray started, checking process..."
          ps aux | grep xray

      - name: Establish Argo Tunnel
        id: tunnel
        run: |
          sudo /usr/local/bin/cloudflared tunnel --url http://localhost:8080 > cf.log 2>&1 &
          
          echo "Waiting for Cloudflare URL..."
          TUNNEL_URL=""
          for i in {1..40}; do
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              CLEAN_URL=$(echo $TUNNEL_URL | sed 's/https:\/\///')
              echo "url=$CLEAN_URL" >> $GITHUB_OUTPUT
              echo "✅ Tunnel Active: $TUNNEL_URL"
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Tunnel failed! Logs:"
            cat cf.log
            exit 1
          fi

      - name: Output VLESS Link
        run: |
          UUID="${{ steps.vars.outputs.uuid }}"
          DOMAIN="${{ steps.tunnel.outputs.url }}"
          
          # لینک VLESS-WebSocket-TLS
          VLESS_LINK="vless://$UUID@$DOMAIN:443?encryption=none&security=tls&sni=$DOMAIN&alpn=http/1.1&fp=chrome&type=ws&host=$DOMAIN&path=%2Fvless#GitHub_VPN_2026"
          
          echo "========================================================="
          echo "✅ VPN آماده است!"
          echo ""
          echo "📋 لینک کانفیگ:"
          echo "$VLESS_LINK"
          echo ""
          echo "🔧 تنظیمات دستی (اگر لینک کار نکرد):"
          echo "Address: $DOMAIN"
          echo "Port: 443"
          echo "UUID: $UUID"
          echo "Network: WebSocket"
          echo "Path: /vless"
          echo "TLS: ON"
          echo "SNI: $DOMAIN"
          echo ""
          echo "📱 اپلیکیشن‌های پیشنهادی:"
          echo "- Android: v2rayNG, NekoBox"
          echo "- iOS: Shadowrocket, Streisand"
          echo "- Windows: v2rayN, Nekoray"
          echo "========================================================="

      - name: Keep Alive (6 hours)
        run: |
          echo "🟢 VPN فعال شد - تا 6 ساعت قابل استفاده است"
          for i in {1..72}; do
            sleep 300
            echo "⏱️ Uptime: $((i*5)) minutes"
          done
