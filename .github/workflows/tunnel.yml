name: Iran VPN - LocalTunnel (Free)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh | sudo bash -s -- install -u root
          sudo npm install -g localtunnel

      - name: Generate Config
        id: vars
        run: |
          UUID=$(/usr/local/bin/xray uuid)
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          
          cat <<EOF > config.json
          {
            "log": {"loglevel": "warning"},
            "inbounds": [{
              "port": 8080,
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "$UUID"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {"path": "/vless"}
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      - name: Start Xray
        run: |
          sudo /usr/local/bin/xray run -c config.json &
          sleep 3

      - name: Start LocalTunnel
        id: tunnel
        run: |
          lt --port 8080 > lt.log 2>&1 &
          
          echo "⏳ Getting tunnel URL..."
          for i in {1..30}; do
            LT_URL=$(grep -o 'https://.*\.loca\.lt' lt.log | head -1)
            if [ -n "$LT_URL" ]; then
              DOMAIN=$(echo $LT_URL | sed 's|https://||')
              echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
              echo "✅ Tunnel: $LT_URL"
              break
            fi
            sleep 2
          done

      - name: Output Config
        run: |
          UUID="${{ steps.vars.outputs.uuid }}"
          DOMAIN="${{ steps.tunnel.outputs.domain }}"
          
          LINK="vless://$UUID@$DOMAIN:443?encryption=none&security=tls&sni=$DOMAIN&type=ws&host=$DOMAIN&path=%2Fvless#Iran_LocalTunnel"
          
          echo "========================================================="
          echo "🇮🇷 VPN رایگان کامل - بدون نیاز به ثبت‌نام"
          echo ""
          echo "📋 لینک:"
          echo "$LINK"
          echo ""
          echo "⚠️ نکته مهم LocalTunnel:"
          echo "اولین بار که وصل میشی، یه صفحه وب باز میشه"
          echo "روی دکمه 'Click to Continue' بزن"
          echo "بعدش VPN وصل میشه"
          echo ""
          echo "🔧 Fragment را فعال کن!"
          echo "========================================================="

      - name: Keep Alive
        run: |
          echo "🟢 Running..."
          while true; do sleep 300; echo "⏱️ Still alive"; done
